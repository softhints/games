<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WORDTETRIS</title>
<style>
  :root {
    --bh: min(86vh, 720px);
    --green: #6aaa64;
    --yellow: #c9b458;
    --purple: #8b7be8;
    --tile: #3a3a3c;
    --tile-b: #565758;
    --bg: #121213;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: #e6e6e6;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1e1e22 0%, #121213 60%);
  }

  #app { display: flex; gap: 16px; align-items: flex-start; }

  #boardWrap {
    padding: 7px;
    background: #1a1a1b;
    border-radius: 14px;
    box-shadow: 0 14px 50px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,255,255,.05);
    touch-action: none;
  }

  #board {
    position: relative;
    height: var(--bh);
    width: calc(var(--bh) * 7 / 12);
    font-size: calc(var(--bh) / 24);
    border-radius: 9px;
    background:
      repeating-linear-gradient(to right, transparent 0 calc(100%/7 - 1px), rgba(255,255,255,.03) calc(100%/7 - 1px) calc(100%/7)),
      repeating-linear-gradient(to bottom, transparent 0 calc(100%/12 - 1px), rgba(255,255,255,.03) calc(100%/12 - 1px) calc(100%/12));
    background-color: #141415;
    overflow: hidden;
  }

  #grid {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(12, 1fr);
  }

  .cell { position: relative; }
  .block {
    position: absolute; inset: 2px;
    border-radius: 6px;
    display: grid; place-items: center;
    font-weight: 800;
    line-height: 1;
    transition: background-color .12s, color .12s;
  }
  .block.filled {
    background: var(--tile);
    box-shadow: inset 0 0 0 1.5px var(--tile-b);
    color: #fff;
  }
  .block.vowel { color: var(--yellow); }

  /* direction-coloured clearing */
  .block.clearing { animation: pop .3s ease; }
  .block.clearing.h {
    background: var(--green);
    box-shadow: 0 0 16px rgba(106,170,100,.95), inset 0 0 0 1.5px #8fd08a;
    color: #fff;
  }
  .block.clearing.v {
    background: var(--yellow);
    box-shadow: 0 0 16px rgba(201,180,88,.95), inset 0 0 0 1.5px #e6d27a;
    color: #1a1a1b;
  }
  .block.clearing.d {
    background: var(--purple);
    box-shadow: 0 0 16px rgba(139,123,232,.95), inset 0 0 0 1.5px #b3a7f5;
    color: #fff;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  #piece {
    position: absolute;
    padding: 2px;
    width: calc(100% / 7);
    height: calc(100% / 12);
    pointer-events: none;
    z-index: 5;
  }
  #piece .block {
    position: static;
    width: 100%; height: 100%;
    background: #f0f0f2;
    color: #121213;
    box-shadow: 0 0 22px rgba(255,255,255,.4), inset 0 0 0 1.5px #fff;
  }
  #piece .block.vowel { color: #8a6d00; }

  /* popup */
  #popup {
    position: absolute; left: 50%; top: 38%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; gap: 5px; align-items: center;
    pointer-events: none; opacity: 0; z-index: 8;
  }
  #popup.show { animation: popupAnim 1.15s cubic-bezier(.2,.9,.3,1) forwards; }
  @keyframes popupAnim {
    0%   { opacity: 0; transform: translate(-50%,-30%) scale(.6); }
    18%  { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
    70%  { opacity: 1; transform: translate(-50%,-58%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-90%) scale(.95); }
  }
  .word-row { display: flex; gap: 3px; }
  .wcell {
    width: 1.4em; height: 1.4em;
    font-size: .78em;
    display: grid; place-items: center;
    color: #fff; font-weight: 800;
    border-radius: 4px;
  }
  .wcell.h { background: var(--green); box-shadow: 0 3px 12px rgba(106,170,100,.5); }
  .wcell.v { background: var(--yellow); color: #1a1a1b; box-shadow: 0 3px 12px rgba(201,180,88,.5); }
  .wcell.d { background: var(--purple); box-shadow: 0 3px 12px rgba(139,123,232,.5); }
  .pts {
    font-size: .6em; font-weight: 800; letter-spacing: 1px;
    color: var(--yellow); text-shadow: 0 2px 10px rgba(201,180,88,.5);
  }

  /* overlay */
  #overlay {
    position: absolute; inset: 0;
    background: rgba(18,18,19,.93);
    border-radius: 9px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    z-index: 20;
    text-align: center; padding: 14px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.1em; letter-spacing: 3px; color: #fff; }
  #overlay p { margin: 0; font-size: .68em; color: #9a9a9e; }
  #overlay .big { font-size: 1.8em; font-weight: 800; color: var(--green); }
  button {
    font-family: inherit; font-weight: 800; letter-spacing: 1px;
    font-size: .62em; padding: 11px 18px; border-radius: 8px;
    background: var(--green); color: #fff; border: none;
    cursor: pointer; transition: transform .1s, background .1s;
  }
  button:hover { background: #7cbb76; }
  button:active { transform: scale(.95); }

  /* sidebar */
  #sidebar {
    display: flex; flex-direction: column; gap: 10px;
    width: 132px;
    padding-top: 2px;
  }
  .stat, .next, .legend {
    background: #1a1a1b;
    border-radius: 10px;
    padding: 8px 10px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
  }
  .stat label, .next label, .legend label {
    display: block;
    font-size: 9px; letter-spacing: 1.6px;
    color: #7d7d82; font-weight: 700; margin-bottom: 3px;
  }
  .stat div { font-size: 20px; font-weight: 800; color: #fff; line-height: 1.1; }
  #queue { display: flex; gap: 4px; flex-wrap: wrap; }
  .qtile {
    width: 24px; height: 24px; border-radius: 5px;
    display: grid; place-items: center;
    background: var(--tile); color: #fff;
    font-weight: 800; font-size: 14px;
    box-shadow: inset 0 0 0 1.5px var(--tile-b);
  }
  .qtile.vowel { color: var(--yellow); }
  .qtile:first-child {
    background: #4a4a4d;
    box-shadow: inset 0 0 0 1.5px #8a8a90, 0 0 10px rgba(255,255,255,.14);
  }
  .legend .row {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; color: #9a9aa0; margin: 3px 0;
  }
  .legend .dot { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 auto; }
  .hint {
    font-size: 9.5px; color: #6a6a70; line-height: 1.55;
    letter-spacing: .3px; padding: 0 3px;
  }
  .hint b { color: #9a9aa0; }
  .btnrow { display: flex; gap: 6px; }
  .btnrow button { flex: 1; font-size: 10px; padding: 9px 4px; }
  #muteBtn { background: #2a2a2d; box-shadow: inset 0 0 0 1px #454548; }
  #muteBtn:hover { background: #35353a; }

  /* definitions panel */
  #defsPanel {
    width: 306px;
    height: var(--bh);
    display: flex; flex-direction: column;
    background: #1a1a1b;
    border-radius: 12px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    padding: 10px 12px;
  }
  #defsPanel > label {
    font-size: 9px; letter-spacing: 2px; color: #7d7d82;
    font-weight: 700; margin-bottom: 8px;
  }
  #defs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; padding-right: 4px; }
  #defs::-webkit-scrollbar { width: 5px; }
  #defs::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 3px; }
  .def-entry {
    border-left: 3px solid #3a3a3c;
    padding: 2px 0 2px 8px;
    animation: fadeUp .35s ease;
  }
  .def-entry.h { border-left-color: var(--green); }
  .def-entry.v { border-left-color: var(--yellow); }
  .def-entry.d { border-left-color: var(--purple); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .def-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  .wchip {
    font-weight: 800; font-size: 12px; letter-spacing: 1px;
    padding: 2px 7px; border-radius: 4px; color: #fff;
  }
  .wchip.h { background: var(--green); }
  .wchip.v { background: var(--yellow); color: #1a1a1b; }
  .wchip.d { background: var(--purple); }
  .def-pos { font-size: 9px; color: #7d7d82; font-style: italic; }
  .def-text { font-size: 11.5px; color: #b9b9be; line-height: 1.4; }
  .empty-defs { font-size: 11px; color: #5c5c61; line-height: 1.5; }

  /* touch controls */
  #touch {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: none;
    gap: 8px; padding: 10px 12px 16px;
    justify-content: center;
    background: linear-gradient(to top, rgba(18,18,19,.98), rgba(18,18,19,0));
    z-index: 30;
  }
  #touch button {
    flex: 1; max-width: 80px; padding: 15px 0; font-size: 17px;
    background: #2a2a2d; box-shadow: inset 0 0 0 1px #454548;
  }
  #touch button:active { background: #3a3a3e; }

  @media (pointer: coarse) {
    #touch { display: flex; }
    body { align-items: flex-start; padding-top: 8px; }
    :root { --bh: min(58vh, 430px); }
  }
  @media (max-width: 1000px) {
    #app { flex-wrap: wrap; justify-content: center; }
    #defsPanel { width: min(94vw, 620px); height: 132px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="boardWrap">
    <div id="board">
      <div id="grid"></div>
      <div id="piece"><div class="block"></div></div>
      <div id="popup"></div>
      <div id="overlay" class="hidden">
        <h2>GAME OVER</h2>
        <div class="big" id="finalScore">0</div>
        <p>FINAL SCORE</p>
        <button id="again">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <aside id="sidebar">
    <div class="stat"><label>SCORE</label><div id="score">0</div></div>
    <div class="stat"><label>LEVEL</label><div id="level">1</div></div>
    <div class="stat"><label>WORDS</label><div id="words">0</div></div>
    <div class="next"><label>NEXT</label><div id="queue"></div></div>
    <div class="legend">
      <label>WORDS</label>
      <div class="row"><span class="dot" style="background:var(--green)"></span>horizontal</div>
      <div class="row"><span class="dot" style="background:var(--yellow)"></span>vertical</div>
      <div class="row"><span class="dot" style="background:var(--purple)"></span>diagonal</div>
    </div>
    <div class="hint">
      <b>←→</b> move<br>
      <b>↓</b> soft drop<br>
      <b>SPACE</b> hard drop<br>
      <b>S</b> swap letter<br>
      <b>P</b> pause
    </div>
    <div class="btnrow">
      <button id="muteBtn" title="Toggle sound">🔊</button>
      <button id="restart">RESET</button>
    </div>
  </aside>

  <aside id="defsPanel">
    <label>WORD MEANINGS</label>
    <div id="defs">
      <div class="empty-defs">Clear a word and its definition appears here.</div>
    </div>
  </aside>
</div>

<div id="touch">
  <button data-act="left">◀</button>
  <button data-act="swap">⇄</button>
  <button data-act="down">▼</button>
  <button data-act="drop">DROP</button>
  <button data-act="right">▶</button>
</div>

  /* ============================== CONSTANTS ============================== */
  const COLS = 7, ROWS = 12;
  const VOWELS = new Set(['A', 'E', 'I', 'O', 'U']);
  const FREQ = { A:9, B:2, C:3, D:4, E:12, F:2, G:3, H:3, I:9, J:1, K:1, L:4, M:3,
                 N:6, O:8, P:2, Q:1, R:6, S:6, T:7, U:4, V:2, W:2, X:1, Y:2, Z:1 };
  const BAG_BASE = [];
  for (const k in FREQ) for (let i = 0; i < FREQ[k]; i++) BAG_BASE.push(k);

  const LOCK_DELAY = 380;

  /* ============================== SOUND ============================== */
  const Sound = (() => {
    let ac = null, muted = false;
    function ctx() {
      if (!ac) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { ac = new AC(); } catch (e) { return null; }
      }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    }
    function beep(freq, dur, type = 'sine', vol = 0.12, delay = 0, slide = null) {
      if (muted) return;
      const c = ctx(); if (!c) return;
      const t = c.currentTime + delay;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.009);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.04);
    }
    return {
      unlock() { ctx(); },
      setMuted(m) { muted = m; },
      isMuted() { return muted; },
      move()  { beep(340, 0.045, 'square', 0.045); },
      swap()  { beep(520, 0.07, 'triangle', 0.08); beep(400, 0.07, 'triangle', 0.07, 0.055); },
      lock()  { beep(130, 0.15, 'triangle', 0.16, 0, 72); beep(70, 0.1, 'sine', 0.1, 0.01); },
      clear(n, cascade) {
        const base = 440 * Math.pow(1.0595, Math.min(cascade, 8) * 2);
        const steps = Math.max(3, Math.min(n, 7));
        for (let i = 0; i < steps; i++) {
          beep(base * Math.pow(2, (i * 2) / 12), 0.17, 'sine', 0.13, i * 0.055);
        }
        beep(base * 2, 0.28, 'triangle', 0.06, steps * 0.055);
      },
      levelUp() { [523, 659, 784, 1046].forEach((f, i) => beep(f, 0.2, 'triangle', 0.12, i * 0.085)); },
      over()    { [392, 330, 262, 196].forEach((f, i) => beep(f, 0.32, 'sawtooth', 0.09, i * 0.13)); },
      err()     { beep(150, 0.14, 'square', 0.09); }
    };
  })();

  /* ============================== DOM ============================== */
  const gridEl    = document.getElementById('grid');
  const pieceEl   = document.getElementById('piece');
  const pieceBlk  = pieceEl.firstElementChild;
  const popupEl   = document.getElementById('popup');
  const overlay   = document.getElementById('overlay');
  const finalEl   = document.getElementById('finalScore');
  const scoreEl   = document.getElementById('score');
  const levelEl   = document.getElementById('level');
  const wordsEl   = document.getElementById('words');
  const queueEl   = document.getElementById('queue');
  const defsEl    = document.getElementById('defs');
  const muteBtn   = document.getElementById('muteBtn');

  const cellEls = [];
  for (let r = 0; r < ROWS; r++) {
    cellEls[r] = [];
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const blk = document.createElement('div');
      blk.className = 'block';
      cell.appendChild(blk);
      gridEl.appendChild(cell);
      cellEls[r][c] = blk;
    }
  }

  /* ============================== STATE ============================== */
  let grid, piece, queue, score, level, wordsCleared;
  let paused = false, gameOver = false, busy = false;
  let softDrop = false, lockTimer = 0;
  let bag = [];
  let lastT = 0;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function drawLetter() {
    if (bag.length < 4) bag = shuffle(BAG_BASE.slice());
    return bag.pop();
  }

  /* ============================== BOARD HELPERS ============================== */
  function colHeight(c) {
    let h = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c]) h++; else break;
    }
    return h;
  }
  function landRow(c) { return ROWS - 1 - colHeight(c); }

  function applyGravity() {
    for (let c = 0; c < COLS; c++) {
      const items = [];
      for (let r = 0; r < ROWS; r++) if (grid[r][c]) items.push(grid[r][c]);
      let i = items.length - 1;
      for (let r = ROWS - 1; r >= 0; r--, i--) {
        grid[r][c] = i >= 0 ? items[i] : null;
      }
    }
  }

  /* ============================== WORD FINDING ============================== */
  const DIRS = [
    [0, 1,  'h'],   // horizontal
    [1, 0,  'v'],   // vertical
    [1, 1,  'd'],   // diagonal down-right
    [1, -1, 'd']    // diagonal down-left
  ];

  function findWordsInRun(run, dir) {
    const out = [];
    const used = new Array(run.length).fill(false);
    const cands = [];
    for (let i = 0; i < run.length; i++) {
      for (let j = i + 3; j <= run.length; j++) {
        let s = '';
        for (let k = i; k < j; k++) s += run[k][2];
        if (DICT.has(s)) cands.push({ i, j, s });
      }
    }
    cands.sort((a, b) => (b.j - b.i) - (a.j - a.i));
    for (const cd of cands) {
      let ok = true;
      for (let k = cd.i; k < cd.j; k++) if (used[k]) { ok = false; break; }
      if (!ok) continue;
      const cells = [];
      for (let k = cd.i; k < cd.j; k++) { used[k] = true; cells.push([run[k][0], run[k][1]]); }
      out.push({ word: cd.s, cells, dir });
    }
    return out;
  }

  function findWords() {
    const found = [];
    for (const [dr, dc, dir] of DIRS) {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!grid[r][c]) continue;
          // only start a run if the previous cell in this direction is empty/out of bounds
          const pr = r - dr, pc = c - dc;
          if (pr >= 0 && pr < ROWS && pc >= 0 && pc < COLS && grid[pr][pc]) continue;

          const run = [];
          let rr = r, cc = c;
          while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && grid[rr][cc]) {
            run.push([rr, cc, grid[rr][cc].ch]);
            rr += dr; cc += dc;
          }
          if (run.length >= 3) found.push(...findWordsInRun(run, dir));
        }
      }
    }
    return found;
  }

  /* ============================== MEANINGS ============================== */
  const defCache = new Map();
  try {
    const stored = JSON.parse(localStorage.getItem('wt_defs_v1') || '{}');
    for (const k in stored) if (stored[k]) defCache.set(k, stored[k]);
  } catch (e) { /* ignore */ }

  let saveTimer = null;
  function persistDefs() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        const obj = {};
        defCache.forEach((v, k) => { if (v) obj[k] = v; });
        localStorage.setItem('wt_defs_v1', JSON.stringify(obj));
      } catch (e) { /* ignore quota errors */ }
    }, 400);
  }

  const pending = new Map();

  function lookup(word) {
    if (defCache.has(word)) return Promise.resolve(defCache.get(word));
    if (pending.has(word)) return pending.get(word);

    const builtin = MEANINGS[word];
    if (builtin) {
      const v = { text: builtin, pos: '' };
      defCache.set(word, v); persistDefs();
      return Promise.resolve(v);
    }

    const p = fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + word.toLowerCase())
      .then(res => { if (!res.ok) throw new Error('nf'); return res.json(); })
      .then(data => {
        const m = data && data[0] && data[0].meanings && data[0].meanings[0];
        const d = m && m.definitions && m.definitions[0] && m.definitions[0].definition;
        if (!d) throw new Error('nd');
        const v = { text: d.charAt(0).toUpperCase() + d.slice(1), pos: m.partOfSpeech || '' };
        defCache.set(word, v); persistDefs();
        return v;
      })
      .catch(() => null)
      .finally(() => { pending.delete(word); });

    pending.set(word, p);
    return p;
  }

  function addDefinition(word, dir) {
    const empty = defsEl.querySelector('.empty-defs');
    if (empty) empty.remove();

    const entry = document.createElement('div');
    entry.className = 'def-entry ' + dir;

    const head = document.createElement('div');
    head.className = 'def-head';
    const chip = document.createElement('span');
    chip.className = 'wchip ' + dir;
    chip.textContent = word;
    head.appendChild(chip);
    entry.appendChild(head);

    const text = document.createElement('div');
    text.className = 'def-text';
    text.textContent = 'Looking up…';
    entry.appendChild(text);

    defsEl.prepend(entry);
    while (defsEl.children.length > 10) defsEl.lastElementChild.remove();

    lookup(word).then(info => {
      if (info) {
        text.textContent = info.text;
        if (info.pos) {
          const pos = document.createElement('span');
          pos.className = 'def-pos';
          pos.textContent = info.pos;
          head.appendChild(pos);
        }
      } else {
        text.textContent = 'No definition available.';
      }
    });
  }

  /* ============================== RENDERING ============================== */
  function render() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const el = cellEls[r][c];
        const v = grid[r][c];
        if (v) {
          el.textContent = v.ch;
          let cls = 'block filled';
          if (VOWELS.has(v.ch)) cls += ' vowel';
          if (v.clearing) cls += ' clearing ' + v.clearing;
          el.className = cls;
        } else {
          if (el.textContent !== '') el.textContent = '';
          if (el.className !== 'block') el.className = 'block';
        }
      }
    }
  }

  function updatePieceEl() {
    if (!piece) { pieceEl.style.display = 'none'; return; }
    pieceEl.style.display = 'block';
    pieceEl.style.left = (piece.col / COLS * 100) + '%';
    pieceEl.style.top = (piece.y / ROWS * 100) + '%';
    pieceBlk.textContent = piece.ch;
    pieceBlk.className = 'block' + (VOWELS.has(piece.ch) ? ' vowel' : '');
  }

  function renderQueue() {
    queueEl.innerHTML = '';
    for (const ch of queue) {
      const t = document.createElement('div');
      t.className = 'qtile' + (VOWELS.has(ch) ? ' vowel' : '');
      t.textContent = ch;
      queueEl.appendChild(t);
    }
  }

  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    wordsEl.textContent = wordsCleared;
  }

  function showPopup(found, gained, cascade) {
    popupEl.innerHTML = '';
    for (const f of found) {
      const row = document.createElement('div');
      row.className = 'word-row';
      for (const ch of f.word) {
        const s = document.createElement('span');
        s.className = 'wcell ' + f.dir;
        s.textContent = ch;
        row.appendChild(s);
      }
      popupEl.appendChild(row);
    }
    const pts = document.createElement('div');
    pts.className = 'pts';
    pts.textContent = '+' + gained + (cascade > 0 ? '  ×' + (cascade + 1) : '');
    popupEl.appendChild(pts);

    popupEl.classList.remove('show');
    void popupEl.offsetWidth;
    popupEl.classList.add('show');
  }

  /* ============================== GAME FLOW ============================== */
  function newGame() {
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    bag = shuffle(BAG_BASE.slice());
    score = 0; level = 1; wordsCleared = 0;
    paused = false; gameOver = false; busy = false;
    softDrop = false; lockTimer = 0;
    piece = null;
    queue = [drawLetter(), drawLetter(), drawLetter()];
    overlay.classList.add('hidden');
    popupEl.classList.remove('show');
    renderQueue();
    updateHUD();
    spawn();
    render();
    updatePieceEl();
  }

  function spawn() {
    const order = [3, 2, 4, 1, 5, 0, 6];
    let col = -1;
    for (const c of order) if (landRow(c) >= 0) { col = c; break; }
    if (col < 0) { endGame(); return; }

    const ch = queue.shift();
    queue.push(drawLetter());
    piece = { ch, col, y: -1 };
    lockTimer = 0;
    softDrop = false;
    renderQueue();
  }

  function lockPiece() {
    if (!piece) return;
    const r = Math.round(piece.y);
    const c = piece.col;
    const ch = piece.ch;
    piece = null;

    if (r < 0 || r >= ROWS || grid[r][c]) { endGame(); return; }

    grid[r][c] = { ch };
    busy = true;
    Sound.lock();
    render();
    resolve(0);
  }

  function resolve(cascade) {
    const found = findWords();
    if (!found.length) {
      busy = false;
      if (!gameOver) { spawn(); updatePieceEl(); }
      return;
    }

    let gained = 0;
    let totalLetters = 0;
    for (const f of found) {
      gained += f.word.length * f.word.length * 10;
      totalLetters += f.word.length;
    }
    gained *= (cascade + 1);

    const prevLevel = level;
    score += gained;
    wordsCleared += found.length;
    level = 1 + Math.floor(wordsCleared / 6);
    updateHUD();

    Sound.clear(totalLetters, cascade);
    if (level > prevLevel) setTimeout(() => Sound.levelUp(), 260);

    showPopup(found, gained, cascade);

    // register meanings (one entry per word)
    for (const f of found) addDefinition(f.word, f.dir);

    const marked = [];
    for (const f of found) {
      for (const [r, c] of f.cells) {
        if (grid[r][c]) { grid[r][c].clearing = f.dir; marked.push([r, c]); }
      }
    }
    render();

    setTimeout(() => {
      for (const [r, c] of marked) grid[r][c] = null;
      applyGravity();
      render();
      setTimeout(() => resolve(cascade + 1), 110);
    }, 300);
  }

  function endGame() {
    gameOver = true;
    piece = null;
    updatePieceEl();
    finalEl.textContent = score;
    overlay.classList.remove('hidden');
    Sound.over();
  }

  /* ============================== ACTIONS ============================== */
  function move(dx) {
    if (busy || gameOver || paused || !piece) return;
    const nc = piece.col + dx;
    if (nc < 0 || nc >= COLS) return;
    if (landRow(nc) < 0) return;
    piece.col = nc;
    const land = landRow(nc);
    if (piece.y > land) piece.y = land;
    lockTimer = 0;
    Sound.move();
    updatePieceEl();
  }

  function hardDrop() {
    if (busy || gameOver || paused || !piece) return;
    const land = landRow(piece.col);
    if (land < 0) return;
    piece.y = land;
    lockPiece();
  }

  function swapLetter() {
    if (busy || gameOver || paused || !piece) return;
    const tmp = piece.ch;
    piece.ch = queue[0];
    queue[0] = tmp;
    renderQueue();
    updatePieceEl();
    Sound.swap();
  }

  function togglePause() {
    if (gameOver) return;
    paused = !paused;
  }

  /* ============================== LOOP ============================== */
  function loop(t) {
    const dt = Math.min(60, t - lastT || 16);
    lastT = t;

    if (!paused && !gameOver && !busy && piece) {
      const land = landRow(piece.col);
      const dropMs = Math.max(95, 720 - (level - 1) * 58);
      const speed = softDrop ? 1 / 38 : 1 / dropMs;

      if (piece.y < land) {
        piece.y = Math.min(land, piece.y + speed * dt);
        lockTimer = 0;
      } else {
        piece.y = land;
        lockTimer += dt;
        if (lockTimer > LOCK_DELAY) lockPiece();
      }
      updatePieceEl();
    }

    requestAnimationFrame(loop);
  }

  /* ============================== INPUT ============================== */
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { move(-1); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { move(1); e.preventDefault(); }
    else if (k === 'ArrowDown') { softDrop = true; e.preventDefault(); }
    else if (k === ' ') { hardDrop(); e.preventDefault(); }
    else if (k === 's' || k === 'S') { swapLetter(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') { togglePause(); e.preventDefault(); }
    else if (k === 'r' || k === 'R') { newGame(); e.preventDefault(); }
  });

  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowDown') softDrop = false;
  });

  document.getElementById('restart').addEventListener('click', () => { Sound.unlock(); newGame(); });
  document.getElementById('again').addEventListener('click', () => { Sound.unlock(); newGame(); });

  muteBtn.addEventListener('click', () => {
    Sound.unlock();
    const m = !Sound.isMuted();
    Sound.setMuted(m);
    muteBtn.textContent = m ? '🔇' : '🔊';
  });

  // unlock audio on first interaction anywhere
  const unlockOnce = () => { Sound.unlock(); window.removeEventListener('pointerdown', unlockOnce); window.removeEventListener('keydown', unlockOnce); };
  window.addEventListener('pointerdown', unlockOnce);
  window.addEventListener('keydown', unlockOnce);

  // touch buttons
  document.querySelectorAll('#touch button').forEach(btn => {
    const act = btn.dataset.act;
    const fire = (ev) => {
      ev.preventDefault();
      Sound.unlock();
      if (act === 'left') move(-1);
      else if (act === 'right') move(1);
      else if (act === 'down') softDrop = true;
      else if (act === 'drop') hardDrop();
      else if (act === 'swap') swapLetter();
    };
    btn.addEventListener('touchstart', fire, { passive: false });
    btn.addEventListener('mousedown', fire);
    const stop = () => { if (act === 'down') softDrop = false; };
    btn.addEventListener('touchend', stop, { passive: false });
    btn.addEventListener('mouseup', stop);
    btn.addEventListener('mouseleave', stop);
  });

  /* ============================== BOOT ============================== */
  newGame();
  requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
